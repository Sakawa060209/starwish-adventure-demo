<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#182947">
  <meta name="description" content="《星愿物语：少女冒险团》2D横版像素挂机刷宝Demo">
  <title>星愿物语：少女冒险团</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game-shell" id="gameShell">
    <header class="topbar">
      <div class="brand" aria-label="星愿物语 少女冒险团">
        <span class="brand-star">✦</span>
        <div><strong>星愿物语</strong><small>少女冒险团 · PIXEL SPRITE UPDATE 0.5</small></div>
      </div>
      <div class="resource-strip">
        <span class="resource stage-pill">晴风花原 <b id="stageLabel">1-1</b></span>
        <span class="resource"><i class="icon level-icon">★</i> Lv.<b id="levelLabel">1</b></span>
        <span class="resource"><i class="icon coin-icon">●</i> <b id="goldLabel">0</b></span>
        <span class="resource crown-resource" hidden id="shardWrap"><i class="icon shard-icon">♛</i> <b id="shardLabel">0</b></span>
      </div>
      <div class="top-actions">
        <button class="icon-button" id="speedButton" aria-label="切换战斗速度">×1</button>
        <button class="icon-button" id="soundButton" aria-label="切换音效">♪</button>
      </div>
    </header>

    <section class="battle-panel" id="battlePanel">
      <canvas id="battleCanvas" width="960" height="540" aria-label="四名少女自动横版战斗画面"></canvas>
      <div class="canvas-vignette"></div>
      <div class="battle-top">
        <div class="stage-title">
          <span id="stageNumber">STAGE 01</span>
          <strong id="stageName">初次出发</strong>
        </div>
        <div class="battle-status" id="battleStatus"><span class="pulse-dot"></span> 准备出发</div>
        <button class="pause-button" id="pauseButton" aria-label="暂停战斗">Ⅱ</button>
      </div>
      <div class="boss-bar" id="bossBar" hidden>
        <div class="boss-heading"><span class="boss-portrait" aria-hidden="true"><i></i></span><div><div class="boss-name"><span>✦</span><b id="bossName">花冠鹿灵</b><span>✦</span></div><small id="bossPhase">第一阶段 · 花藤试探</small></div></div>
        <div class="bar boss-hp"><i id="bossHpFill"></i><span class="phase-mark p60"></span><span class="phase-mark p30"></span></div>
        <small id="bossHpText">1650 / 1650</small>
      </div>
      <div class="wave-track" aria-label="本关波次进度">
        <span id="waveText">WAVE 1 / 2</span>
        <div id="waveDots" class="wave-dots"></div>
      </div>
      <div class="battle-feed" id="battleFeed" aria-live="polite"></div>
      <button class="report-chip" id="reportButton" hidden>战报</button>
      <div class="loot-float" id="lootFloat"></div>
      <div class="start-overlay" id="startOverlay">
        <div class="start-card">
          <span class="eyebrow">PIXEL IDLE RPG</span>
          <h1>星愿物语</h1>
          <p class="subtitle">少女冒险团</p>
          <div class="party-preview" aria-hidden="true">
            <span class="portrait mage"><span class="p-hair"></span><span class="p-face"><i></i></span><span class="p-accent"></span></span>
            <span class="portrait archer"><span class="p-hair"></span><span class="p-face"><i></i></span><span class="p-accent"></span></span>
            <span class="portrait lancer"><span class="p-hair"></span><span class="p-face"><i></i></span><span class="p-accent"></span></span>
            <span class="portrait knight"><span class="p-hair"></span><span class="p-face"><i></i></span><span class="p-accent"></span></span>
          </div>
          <p>四位少女已经准备好啦！<br>开始探索晴风花原吧。</p>
          <button class="primary-button large" id="startButton">踏上冒险</button>
          <small>自动战斗 · 随机刷宝 · 本地存档</small>
        </div>
      </div>
    </section>

    <section class="party-hud" id="partyHud" aria-label="小队状态"></section>

    <section class="control-ribbon">
      <div class="mode-copy">
        <span class="status-gem"></span>
        <div><small>当前挂机策略</small><strong id="modeLabel">自动推进</strong></div>
      </div>
      <div class="xp-block">
        <span id="xpText">冒险经验 0 / 30</span>
        <div class="bar xp-bar"><i id="xpFill"></i></div>
      </div>
      <button class="secondary-button" id="modeButton">切换为重复刷图</button>
    </section>

    <nav class="bottom-nav" aria-label="主要功能">
      <button class="nav-button active" data-view="battle"><span>⚔</span>战斗</button>
      <button class="nav-button" data-view="formation"><span>♟</span>编队</button>
      <button class="nav-button" data-view="inventory"><span>▦</span>背包<i class="badge" id="inventoryBadge" hidden>0</i></button>
      <button class="nav-button" data-view="map"><span>⌖</span>地图</button>
      <button class="nav-button" data-view="skills"><span>✧</span>技能</button>
      <button class="nav-button" data-view="settings"><span>⚙</span>设置</button>
    </nav>
  </main>

  <div class="drawer-backdrop" id="drawerBackdrop" hidden></div>
  <aside class="drawer" id="drawer" aria-live="polite" aria-label="功能面板" hidden>
    <header class="drawer-header">
      <div><small id="drawerKicker">冒险团管理</small><h2 id="drawerTitle">背包</h2></div>
      <button class="close-button" id="closeDrawer" aria-label="关闭">×</button>
    </header>
    <div class="drawer-body" id="drawerBody"></div>
  </aside>

  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <section class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="close-button modal-close" id="modalClose" aria-label="关闭">×</button>
      <div id="modalContent"></div>
    </section>
  </div>

  <div class="toast-stack" id="toastStack" aria-live="polite"></div>

  <script src="logic.js"></script>
  <script src="game.js"></script>
</body>
</html>
